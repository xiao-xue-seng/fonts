# 在 main 分支新增字型或修改腳本，它就會自動生成最新的 fonts.json 並刷新 @main 的 CDN 快取

name: Generate Font List JSON

on:
  push:
    tags:
      - "v*" # 當 push 新 Tag 時觸發
    branches:
      - main # 當 push 到 main 分支時觸發
    paths:
      - "**/result.css" # 只有字型/工具/腳本有變動時才觸發，避免無謂執行
      - "tools/**"
      - "api/fonts.json"
      - ".github/workflows/generate-fonts-json.yml"

# 給予 Actions 機器人寫入程式碼庫的權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 複製程式碼到 GitHub Actions 虛擬機 (fetch-depth: 1 保持極速，不安裝巨大歷史二進位檔)
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 2. 僅拉取輕量的 Tag 標記資訊
      - name: Fetch git tags
        run: git fetch --tags --depth=1

      # 3. 安裝 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 4. 執行 Python 腳本產生/更新 fonts.json
      - name: Run font list script
        run: python3 tools/generate_font_list.py

      # 5. 如果 api/fonts.json 有更新，自動 Commit & Push，並刷新 @main 快取
      - name: Commit, push, and purge @main CDN
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add api/fonts.json

          # 檢查是否有檔案變動 (包含手動修改或 Python 腳本更新)
          if ! git diff --quiet || ! git diff --staged --quiet; then
            echo "api/fonts.json changed. Committing, pushing, and purging CDN..."
            git commit -m "auto: update api/fonts.json [skip ci]"
            git push

            # 推送成功後，立刻刷新 @main 的 fonts.json CDN 快取
            curl -s https://purge.jsdelivr.net/gh/xiao-xue-seng/fonts@main/api/fonts.json
          else
            echo "No changes in api/fonts.json. Purging @main CDN just in case..."
            # 即使沒有 Git 變動（例如手動觸發），也順便 Purge 保障最新
            curl -s https://purge.jsdelivr.net/gh/xiao-xue-seng/fonts@main/api/fonts.json
          fi
